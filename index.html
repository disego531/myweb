<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热图导航 · 智能路径处理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f4f9ff 0%, #e6f0fa 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 3.2rem;
            box-shadow: 0 35px 65px -20px #1c3f60b3, inset 0 1px 4px white;
            width: 100%;
            max-width: 1100px;
            padding: 2.8rem 3rem;
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        h1 {
            font-size: 2.7rem;
            font-weight: 620;
            letter-spacing: -0.02em;
            color: #0a2b44;
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.5rem;
            border-bottom: 3px solid #a0c4e8;
            padding-bottom: 0.8rem;
        }

        .source-info {
            font-size: 1rem;
            color: #1f4370e6;
            margin: 1rem 0 2rem 0;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            flex-wrap: wrap;
            background: #deecfccc;
            padding: 0.7rem 2rem;
            border-radius: 60px;
            width: fit-content;
            border: 1px solid white;
        }

        .source-info code {
            background: #173e5f;
            color: white;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 520;
        }

        .debug-info {
            background: #2d4b6e;
            color: #eef5ff;
            padding: 0.5rem 1.5rem;
            border-radius: 30px;
            font-family: monospace;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: inline-block;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 1.8rem 0 1.4rem 0;
        }

        .stats-bar h2 {
            font-weight: 550;
            font-size: 1.8rem;
            color: #103551;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .badge {
            background: #236197;
            color: white;
            border-radius: 40px;
            padding: 0.3rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            box-shadow: inset 0 1px 4px #bbdbff;
        }

        .table-wrapper {
            max-height: 500px;
            overflow-y: auto;
            border-radius: 36px;
            background: #eaf1fab3;
            padding: 0.3rem;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: inset 0 2px 6px #0000000c;
        }

        .markdown-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1.05rem;
            border-radius: 36px;
            overflow: hidden;
        }

        .markdown-table thead tr {
            background: #1e3b5a;
            color: white;
            font-weight: 530;
            text-align: left;
        }

        .markdown-table th {
            padding: 1.2rem 1.8rem;
            font-size: 1.1rem;
            letter-spacing: 0.3px;
        }

        .markdown-table th:first-child {
            border-top-left-radius: 30px;
        }
        .markdown-table th:last-child {
            border-top-right-radius: 30px;
        }

        .markdown-table tbody tr {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            border-bottom: 1px solid #c9dff5;
            transition: background 0.15s;
        }

        .markdown-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.95);
        }

        .markdown-table td {
            padding: 1.2rem 1.8rem;
            color: #102d44;
            border-bottom: 1px solid #c9dff5;
        }

        .markdown-table td:first-child {
            font-weight: 500;
        }

        .markdown-table td a {
            color: #1d5191;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: #e3f0ff;
            padding: 0.3rem 1.2rem 0.3rem 1rem;
            border-radius: 40px;
            border: 1px solid white;
            transition: all 0.15s;
            word-break: break-word;
        }

        .markdown-table td a:hover {
            background: #cbe3ff;
            border-color: #8eb9e6;
            transform: translateY(-1px);
            box-shadow: 0 6px 12px -8px #1b3d60;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: #f0f8ffed;
            border-radius: 3rem;
            border: 2px dashed #8fb1d1;
            color: #1f4d78;
            font-size: 1.2rem;
        }

        .error-tip {
            background: #feeceb;
            border-left: 6px solid #c25a4a;
            padding: 1.5rem 2.5rem;
            border-radius: 40px;
            margin: 1rem 0;
            color: #4f221e;
            font-weight: 450;
            word-break: break-word;
        }

        .loading-spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #a0bcdb;
            border-top-color: #103450;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .footer-bar {
            margin-top: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #c2d8f1;
            padding-top: 1.5rem;
        }

        .file-location {
            background: #e5effb;
            padding: 0.5rem 1.8rem;
            border-radius: 40px;
            color: #113853;
            font-size: 0.98rem;
            font-weight: 480;
            border: 1px solid white;
            font-family: monospace;
        }

        .refresh-btn {
            background: transparent;
            border: 2px solid #a2c2e5;
            padding: 0.5rem 2.2rem;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 560;
            color: #1b4f7a;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .refresh-btn:hover {
            background: #e3efff;
            border-color: #3f7eb0;
            transform: scale(0.98);
        }

        .markdown-icon {
            font-size: 1.2rem;
            margin-right: 0.2rem;
        }

        .path-test {
            background: #f0f0f0;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #444;
        }
    </style>
</head>
<body>
<div class="glass-panel">
    <h1>
        <span>📋</span> 热图清单 · 智能路径
        <span style="font-size: 1.2rem; margin-left: auto; background: #bed6f2; padding: 0.3rem 1.5rem; border-radius: 60px; font-weight: 430;">list.md</span>
    </h1>

    <!-- 显示当前路径信息 -->
    <div class="source-info">
        <span>📂 当前页面 URL:</span>
        <code id="currentUrlDisplay">计算中...</code>
        <span>⬇️ 尝试加载</span>
        <code id="listPathDisplay">./list.md</code>
    </div>

    <!-- 计数 + 标题 -->
    <div class="stats-bar">
        <h2>
            <span>🔗</span> 映射条目
        </h2>
        <div class="badge" id="countDisplay">——</div>
    </div>

    <!-- 表格容器 (动态渲染) -->
    <div id="tableContainer" class="table-wrapper">
        <!-- 加载占位 -->
        <div class="empty-state" id="loadingPlaceholder">
            <div style="display: flex; gap: 0.8rem; align-items: center; justify-content: center;">
                <span class="loading-spinner"></span>
                正在尝试加载 <code>list.md</code> ...
            </div>
        </div>
    </div>

    <!-- 底部：刷新 + 路径提示 -->
    <div class="footer-bar">
        <span class="file-location" id="fullPathDisplay">计算路径中...</span>
        <button class="refresh-btn" id="refreshBtn">
            <span>↻</span> 重新加载
        </button>
    </div>
</div>

<script>
    (function() {
        // DOM 元素
        const tableContainer = document.getElementById('tableContainer');
        const countDisplay = document.getElementById('countDisplay');
        const refreshBtn = document.getElementById('refreshBtn');
        const currentUrlDisplay = document.getElementById('currentUrlDisplay');
        const listPathDisplay = document.getElementById('listPathDisplay');
        const fullPathDisplay = document.getElementById('fullPathDisplay');

        // 获取当前页面的URL路径信息
        function getBasePath() {
            // 获取当前页面的完整URL
            const currentUrl = window.location.href;
            // 获取当前页面的路径部分（不包括域名）
            const pathname = window.location.pathname;
            
            // 显示当前URL
            currentUrlDisplay.textContent = currentUrl;
            
            // 计算index.html所在的目录
            let baseDir = '';
            if (pathname.includes('/')) {
                // 去掉文件名，只保留目录路径
                const lastSlashIndex = pathname.lastIndexOf('/');
                if (lastSlashIndex > 0) {
                    baseDir = pathname.substring(0, lastSlashIndex + 1);
                } else {
                    baseDir = '/';
                }
            }
            
            return {
                fullUrl: currentUrl,
                pathname: pathname,
                baseDir: baseDir,
                origin: window.location.origin
            };
        }

        // 构建完整的list.md路径（尝试多种可能性）
        function getListMdPaths() {
            const pathInfo = getBasePath();
            const paths = [];
            
            // 方法1: 基于当前目录的相对路径（最常用）
            paths.push({
                url: './list.md',
                description: '相对路径 (./list.md)'
            });
            
            // 方法2: 基于baseDir的绝对路径
            if (pathInfo.baseDir) {
                const absolutePath = pathInfo.baseDir + 'list.md';
                paths.push({
                    url: absolutePath,
                    description: '基于当前目录的绝对路径'
                });
            }
            
            // 方法3: 根目录相对路径
            paths.push({
                url: '/list.md',
                description: '网站根目录相对路径'
            });
            
            // 方法4: 尝试去掉可能的多级目录
            if (pathInfo.pathname.split('/').length > 2) {
                paths.push({
                    url: '../list.md',
                    description: '上级目录相对路径'
                });
            }
            
            return paths;
        }

        // 尝试多个路径加载list.md
        async function tryLoadListMd() {
            const paths = getListMdPaths();
            
            // 显示尝试的路径
            listPathDisplay.innerHTML = paths.map(p => `<span class="path-test">${p.description}</span>`).join(' ');
            
            // 依次尝试每个路径
            for (let i = 0; i < paths.length; i++) {
                const path = paths[i];
                const urlWithCache = path.url + '?t=' + Date.now();
                
                try {
                    console.log(`尝试加载: ${path.url} (${path.description})`);
                    
                    const response = await fetch(urlWithCache, { 
                        cache: 'no-store', 
                        credentials: 'same-origin',
                        method: 'GET'
                    });
                    
                    if (response.ok) {
                        const text = await response.text();
                        if (text && text.trim()) {
                            // 成功加载，显示使用的路径
                            fullPathDisplay.textContent = `✅ 成功加载: ${path.url}`;
                            return { success: true, content: text, usedPath: path.url };
                        }
                    }
                } catch (e) {
                    console.log(`路径 ${path.url} 加载失败:`, e.message);
                    // 继续尝试下一个路径
                }
            }
            
            // 所有路径都失败
            fullPathDisplay.textContent = '❌ 所有路径尝试均失败';
            return { success: false, content: null, usedPath: null };
        }

        /**
         * 解析 Markdown 表格
         */
        function parseMarkdownTable(markdownText) {
            const lines = markdownText.split(/\r?\n/);
            const rows = [];
            let headerParsed = false;
            let nameColIndex = -1, pathColIndex = -1;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line.startsWith('|') || !line.endsWith('|')) {
                    continue;
                }

                const cleaned = line.slice(1, -1).trim();
                const cells = cleaned.split('|').map(cell => cell.trim());

                if (cells.length === 0) continue;

                // 跳过分隔行
                if (cells.some(cell => cell.includes('---') || cell.includes('--:'))) {
                    continue;
                }

                // 解析表头
                if (!headerParsed) {
                    for (let j = 0; j < cells.length; j++) {
                        const lower = cells[j].toLowerCase();
                        if (lower.includes('显示名称') || lower.includes('display') || lower.includes('名称')) {
                            nameColIndex = j;
                        } else if (lower.includes('文件路径') || lower.includes('file') || lower.includes('path') || lower.includes('路径')) {
                            pathColIndex = j;
                        }
                    }
                    if (nameColIndex === -1 && cells.length >= 2) {
                        nameColIndex = 0;
                        pathColIndex = 1;
                    }
                    headerParsed = true;
                    continue;
                }

                // 提取数据行
                if (nameColIndex !== -1 && pathColIndex !== -1 && cells.length > Math.max(nameColIndex, pathColIndex)) {
                    let display = cells[nameColIndex].trim();
                    let filepath = cells[pathColIndex].trim();

                    display = display.replace(/\*\*/g, '').replace(/__/g, '');
                    filepath = filepath.replace(/\*\*/g, '').replace(/__/g, '');

                    if (filepath.startsWith('`') && filepath.endsWith('`')) {
                        filepath = filepath.slice(1, -1);
                    }

                    if (display && filepath) {
                        rows.push({ display, filepath });
                    }
                }
            }

            return rows;
        }

        // 构建完整的文件URL
        function buildFileUrl(filepath) {
            // 如果已经是完整的HTTP URL，直接使用
            if (filepath.startsWith('http://') || filepath.startsWith('https://')) {
                return filepath;
            }
            
            // 移除开头的 ./ 或 /
            let cleanPath = filepath.replace(/^\.?\//, '');
            
            // 获取当前页面的基础路径
            const pathInfo = getBasePath();
            const baseDir = pathInfo.baseDir;
            
            // 构建完整URL
            if (cleanPath.startsWith('heat_maps/')) {
                return baseDir + cleanPath;
            } else if (cleanPath.includes('heat_maps/')) {
                return baseDir + cleanPath;
            } else {
                return baseDir +  cleanPath;
            }
        }

        // 渲染表格
        function renderTable(entries) {
            if (!entries || entries.length === 0) {
                tableContainer.innerHTML = `
                    <div class="empty-state">
                        <span style="font-size: 3rem; display: block; margin-bottom: 0.5rem;">📭</span>
                        没有从 <code>list.md</code> 中解析到任何有效条目
                    </div>
                `;
                countDisplay.textContent = '0 项';
                return;
            }

            let tableHtml = `
                <table class="markdown-table">
                    <thead>
                        <tr>
                            <th>显示名称</th>
                            <th>文件路径 (超链接)</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            entries.forEach(entry => {
                const displayEscaped = entry.display.replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
                
                const filepathEscaped = entry.filepath.replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
                
                const href = buildFileUrl(entry.filepath);
                const hrefAttr = href.replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '"') return '&quot;';
                    return m;
                });

                tableHtml += `
                    <tr>
                        <td>${displayEscaped}</td>
                        <td><a href="${hrefAttr}" target="_blank" rel="noopener noreferrer">📁 ${filepathEscaped}</a></td>
                    </tr>
                `;
            });

            tableHtml += `</tbody></table>`;
            tableContainer.innerHTML = tableHtml;
            countDisplay.textContent = `${entries.length} 项`;
        }

        // 显示错误
        function showError(message) {
            tableContainer.innerHTML = `
                <div class="error-tip">
                    <strong>⚠️ 加载失败</strong><br>
                    ${message.replace(/[&<>]/g, function(m) {
                        if (m === '&') return '&amp;';
                        if (m === '<') return '&lt;';
                        if (m === '>') return '&gt;';
                        return m;
                    })}<br>
                    <span style="font-size:0.95rem;">请确认 <code>list.md</code> 文件存在且可读。</span>
                </div>
            `;
            countDisplay.textContent = '错误';
        }

        // 显示加载中
        function showLoading() {
            tableContainer.innerHTML = `
                <div class="empty-state">
                    <div style="display: flex; gap: 0.8rem; align-items: center; justify-content: center;">
                        <span class="loading-spinner"></span>
                        尝试多个路径加载 <code>list.md</code> ...
                    </div>
                </div>
            `;
        }

        // 主加载函数
        async function loadMarkdownAndRender() {
            showLoading();
            
            const result = await tryLoadListMd();
            
            if (result.success && result.content) {
                const entries = parseMarkdownTable(result.content);
                renderTable(entries);
            } else {
                const pathInfo = getBasePath();
                showError(`无法加载 list.md 文件。已尝试多个路径。<br>当前页面路径: ${pathInfo.pathname}<br>请确保文件存在于正确的目录。`);
            }
        }

        // 初始化
        loadMarkdownAndRender();

        // 刷新按钮
        refreshBtn.addEventListener('click', function(e) {
            e.preventDefault();
            loadMarkdownAndRender();
        });
    })();
</script>

<noscript>
    <div style="background:#f3dddd; padding:2rem; border-radius:2rem; text-align:center; margin:2rem 0;">
        ⚠️ 您的浏览器未启用 JavaScript，无法加载动态内容。<br>
        请直接查看 <code>./list.md</code> 文件。
    </div>
</noscript>
</body>
</html>
