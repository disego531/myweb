<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地球内部结构剖面图 · 3D</title>
<style>
  :root{
    --ink:#12212f;
    --muted:#68798d;
    --line:#e3eaf3;
    --line-2:#edf3f9;
    --blue:#2f8fd6;
    --deep:#0d3b60;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:#ffffff;
    color:var(--ink);
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    height:100vh;height:100dvh;
    max-width:1600px;margin:0 auto;
    padding:12px 18px 14px;
    display:flex;flex-direction:column;gap:10px;
  }
  .hero{
    flex:none;display:flex;align-items:baseline;justify-content:center;
    gap:16px;flex-wrap:wrap;
  }
  .hero h1{
    font-size:clamp(16px,1.6vw,22px);font-weight:800;letter-spacing:.02em;
    background:linear-gradient(100deg,#0d3b60,#2f8fd6 60%,#0d3b60);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero .sub{font-size:11.5px;color:var(--muted);letter-spacing:.02em;}
  .card{
    background:#fff;border:1px solid var(--line);border-radius:16px;
    box-shadow:0 1px 2px rgba(16,42,67,.04), 0 8px 24px rgba(16,42,67,.05);
  }
  .workspace{
    flex:1;min-height:0;
    display:grid;
    grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);
    gap:12px;
  }
  .diagram-card{
    display:flex;flex-direction:column;min-height:0;
    padding:10px 12px 8px;position:relative;
  }
  .tabs{
    flex:none;display:flex;gap:6px;background:#f2f6fb;
    border:1px solid var(--line);border-radius:11px;padding:4px;
    width:fit-content;margin:0 auto 6px;
  }
  .tab{
    font-family:inherit;font-size:12.5px;font-weight:600;
    color:var(--muted);background:transparent;border:none;cursor:pointer;
    padding:6px 18px;border-radius:8px;transition:.2s;
  }
  .tab:hover{color:var(--blue);}
  .tab.active{
    color:#fff;background:linear-gradient(135deg,#4fb4f0,#2f8fd6);
    box-shadow:0 3px 10px rgba(47,143,214,.32);
  }
  .mode-desc{
    flex:none;text-align:center;font-size:11px;color:var(--muted);
    margin-bottom:2px;min-height:15px;
  }
  #canvas-wrap{
    flex:1;min-height:0;position:relative;
    border-radius:12px;overflow:hidden;background:#f7fbff;
  }
  #canvas-wrap canvas{display:block;width:100%;height:100%;}

  #loading{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:#f7fbff;color:var(--muted);font-size:13px;z-index:5;
    transition:opacity .4s;
  }
  #loading.hide{opacity:0;pointer-events:none;}

  .label-3d{
    font-size:11px;font-weight:600;color:#0d3b60;
    background:rgba(255,255,255,.88);
    border:1px solid rgba(47,143,214,.35);
    border-radius:6px;padding:2px 7px;
    white-space:nowrap;pointer-events:none;
    box-shadow:0 2px 8px rgba(16,42,67,.08);
  }
  .label-3d small{display:block;font-weight:400;font-size:9.5px;color:#5b748c;line-height:1.4;}

  /* 地心标签稍微强调 */
  .label-3d-center{
    border-color: rgba(232,137,12,.55);
    box-shadow:0 0 0 3px rgba(240,162,2,.10), 0 2px 8px rgba(16,42,67,.10);
  }

  /* 界面标签 */
  .label-3d-interface{
    border-color: rgba(47,143,214,.5);
    background: rgba(255,255,255,.94);
  }
  .label-3d-interface small{
    color: #2f8fd6;
    font-weight: 600;
  }

  .info-card{
    min-height:0;overflow-y:auto;padding:16px 22px 18px;
    scrollbar-width:thin;
  }
  .info-card::-webkit-scrollbar{width:6px;}
  .info-card::-webkit-scrollbar-thumb{background:#d6e2ee;border-radius:3px;}

  .info-head{
    display:flex;gap:11px;align-items:flex-start;
    padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--line-2);
  }
  .swatch{
    width:14px;height:14px;border-radius:4px;background:var(--c);
    flex:none;margin-top:4px;box-shadow:0 0 0 3px rgba(47,143,214,.10);
  }
  .info-head h2{font-size:18px;font-weight:800;color:var(--deep);margin-bottom:2px;}
  .info-head .en{font-size:11px;color:var(--muted);}

  .stats{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));
    gap:7px;margin-bottom:12px;
  }
  .stat{background:#f6f9fd;border:1px solid #e6eef7;border-radius:9px;padding:7px 9px;}
  .stat span{display:block;font-size:10px;color:#8a9caf;margin-bottom:3px;}
  .stat strong{font-size:12px;font-weight:700;color:#22405c;}

  .desc{
    font-size:12.5px;line-height:1.82;color:#3a5064;
    background:#f2f8ff;border-left:3px solid #7dc4f2;
    border-radius:0 8px 8px 0;padding:9px 12px;margin-bottom:11px;
    text-indent:2em;
  }
  .points{list-style:none;display:flex;flex-direction:column;gap:6px;}
  .points li{
    position:relative;padding-left:17px;
    font-size:12px;line-height:1.68;color:#4a6076;
  }
  .points li::before{
    content:"";position:absolute;left:4px;top:7px;
    width:5px;height:5px;border-radius:50%;background:#4fb4f0;
  }

  @media (max-width:860px){
    .app{padding:8px 10px;gap:7px;}
    .workspace{grid-template-columns:1fr;grid-template-rows:minmax(0,1.15fr) minmax(0,1fr);}
    .hero .sub{display:none;}
    .info-card{padding:12px 14px 14px;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="hero">
    <h1>地球内部结构剖面图 · 3D</h1>
    <span class="sub">拖拽旋转 · 滚轮缩放 · 点击圈层查看详情</span>
  </header>

  <div class="workspace">

    <section class="card diagram-card">
      <div class="tabs">
        <button class="tab active" data-mode="physical">物理结构</button>
        <button class="tab" data-mode="chemical">化学组成</button>
      </div>

    <aside class="card info-card" id="info"></aside>

  </div>

</div>

<!-- ==================== 主脚本 ==================== -->
<script type="module">

import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ==================== 数据 ==================== */
const MODES = {

      },

        id:'mantle', name:'地幔', en:'Mantle',

        stats:[['深度范围','约 17 – 2900 km'],['占地球体积','约 82%'],['占地球质量','约 67%'],['密度','3.3 – 5.6 g/cm³']],
        desc:'地幔位于地壳与地核之间，是地球内部体积和质量最大的圈层。它主要由富含镁、铁的硅酸盐矿物（如橄榄石、辉石）组成，上部和下部在物理性质上有明显差别。',
        points:['上地幔（约 17 – 670 km）：包含软流圈，是岩浆的重要来源','下地幔（约 670 – 2900 km）：高压下矿物结构发生转变，更加致密','地幔与地核的分界面叫“古登堡面”，深度约 2900 km','地幔物质的对流是板块运动、火山与地震的根本动力']
      },
      {
        id:'core', name:'地核', en:'Core',

        stats:[['深度范围','约 2900 – 6371 km'],['半径','约 3471 km'],['占地球质量','约 31%'],['密度','9.9 – 13.1 g/cm³']],
        desc:'地核是地球的中心部分，半径约 3471 千米，比火星的半径还要大。它主要由铁和镍组成，分为液态的外核和固态的内核两部分。',
        points:['主要成分：铁（约85%）、镍（约5%），以及硫、硅、氧等轻元素','外核为液态，内核为固态，两者的分界面深度约 5150 km','地核温度可达 5000–6000 ℃，与太阳表面温度相当','液态外核的对流产生了地球磁场，保护地球免受太阳风侵袭']

/* ==================== 状态 ==================== */
let currentMode = 'physical';
let currentId = MODES.physical.layers[0].id;
let scene, camera, renderer, labelRenderer, controls;
let layerMeshes = [];
let ringMeshes = [];
let labelObjects = [];
let interfaceLines = [];
let raycaster, mouse;

const BASE_RADIUS = 1.5;
const PHI_START = Math.PI * 1.10;
const PHI_LENGTH = Math.PI * 1.55;

/* ==================== 初始化 Three.js ==================== */
function initThree(){
  const wrap = document.getElementById('canvas-wrap');
  const W = wrap.clientWidth || 800;
  const H = wrap.clientHeight || 600;

  scene = new THREE.Scene();
  scene.background = new THREE.Color('#f7fbff');

  camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 1000);
  camera.position.set(3.4, 2.2, 4.0);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(W, H);
  wrap.appendChild(renderer.domElement);

  labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(W, H);
  labelRenderer.domElement.style.position = 'absolute';
  labelRenderer.domElement.style.top = '0';
  labelRenderer.domElement.style.left = '0';
  labelRenderer.domElement.style.pointerEvents = 'none';
  wrap.appendChild(labelRenderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.rotateSpeed = 0.9;
  controls.zoomSpeed = 0.9;
  controls.minDistance = 2.6;
  controls.maxDistance = 8.0;
  controls.enablePan = false;
  controls.autoRotate = false;    // 已关闭自动旋转
  controls.target.set(0, 0, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 1.6));

  const dir1 = new THREE.DirectionalLight(0xffffff, 2.0);
  dir1.position.set(5, 6, 4);
  scene.add(dir1);

  const dir2 = new THREE.DirectionalLight(0x88bbff, 1.0);
  dir2.position.set(-4, -3, -5);
  scene.add(dir2);

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  renderer.domElement.addEventListener('click', onCanvasClick);
  window.addEventListener('resize', onResize);

  animate();
  document.getElementById('loading').classList.add('hide');
}

/* ==================== 关键界面定义（角度自动均匀分配） ==================== */
function getInterfaces(mode){
  let defs;
  if (mode === 'physical'){
    defs = [
      { name: '地表',       info: '0 km',      r: 1.0 },
      { name: '岩石圈底部', info: '约 100 km',  r: 0.855 },
      { name: '软流圈底部', info: '约 400 km',  r: 0.72 },
      { name: '古登堡面',   info: '约 2900 km', r: 0.48 },
      { name: '内外核分界', info: '约 5150 km', r: 0.20 }
    ];
  } else {
    defs = [
      { name: '地表',       info: '0 km',      r: 1.0 },
      { name: '莫霍面',     info: '约 17 km',   r: 0.94 },
      { name: '古登堡面',   info: '约 2900 km', r: 0.48 },
      { name: '内外核分界', info: '约 5150 km', r: 0.20 }
    ];
  }

  const startAngle = 15;
  const endAngle = 85;
  const step = (endAngle - startAngle) / (defs.length - 1);

  return defs.map((d, i) => ({
    ...d,
    angle: startAngle + step * i
  }));
}

/* ==================== 构建 3D 地球 ==================== */
function buildGlobe(mode){
  // 清空旧的圈层
  layerMeshes.forEach(item => {
    scene.remove(item.mesh);
    item.mesh.geometry.dispose();
    item.mesh.material.dispose();
  });
  layerMeshes = [];

  // 清空旧的切面轮廓环
  ringMeshes.forEach(r => {
    scene.remove(r);
    r.geometry.dispose();
    r.material.dispose();
  });
  ringMeshes = [];

  // 清空旧的标签 / 引线 / 圆点（labelObjects 里混有 DOM 元素、Line、Mesh）
  labelObjects.forEach(obj => {
    if (obj.element && obj.element.parentNode) obj.element.parentNode.removeChild(obj.element);
    scene.remove(obj);
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
      else obj.material.dispose();
    }
  });
  labelObjects = [];

  // 清空旧的界面标注
  interfaceLines.forEach(obj => {
    if (obj.element && obj.element.parentNode) obj.element.parentNode.removeChild(obj.element);
    scene.remove(obj);
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
      else obj.material.dispose();
    }
  });
  interfaceLines = [];

  const layers = MODES[mode].layers;

  layers.forEach(layer => {
    const rOuter = layer.rOuter * BASE_RADIUS;
    const geometry = new THREE.SphereGeometry(
      rOuter, 64, 48,
      PHI_START, PHI_LENGTH,
      0, Math.PI
    );

    const color = new THREE.Color(layer.color);
    const material = new THREE.MeshStandardMaterial({
      color: color,
      roughness: 0.62,
      metalness: 0.08,
      emissive: color.clone().multiplyScalar(0.12),
      side: THREE.DoubleSide
    });

    const mesh = new THREE.Mesh(geometry, material);
    mesh.userData = { id: layer.id, layer: layer, baseColor: color.clone() };
    scene.add(mesh);
    layerMeshes.push({ id: layer.id, mesh: mesh, layer: layer });

    // 切面轮廓环
    const ringGeo = new THREE.TorusGeometry(rOuter, 0.006, 8, 80, PHI_LENGTH);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0xffffff, transparent: true, opacity: 0.55
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2;
    ring.rotation.z = PHI_START;
    scene.add(ring);
    ringMeshes.push(ring);
  });

  // 地心标签（外移 + 引线）
  addLabels(layers);

  // 关键界面标注（带引线）
  addInterfaceLabels(mode);

  updateHighlight();
}

/* ==================== 地心标签（带引线，放在球体外） ==================== */
function addLabels(layers){
  const LABEL_RADIUS = BASE_RADIUS * 1.20;
  const angle = (95 * Math.PI) / 180;   // 与界面标签错开角度
  const xLb = Math.cos(angle) * LABEL_RADIUS;
  const yLb = Math.sin(angle) * LABEL_RADIUS;

  /* --- 引线：球心 → 标签 --- */
  const pts = [
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(xLb, yLb, 0)
  ];
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineDashedMaterial({
    color: 0xe8890c,
    dashSize: 0.045,
    gapSize: 0.035,
    transparent: true,
    opacity: 0.8
  });
  const line = new THREE.Line(geo, mat);
  line.computeLineDistances();
  scene.add(line);
  labelObjects.push(line);

  /* --- 球心处的小圆点（保留，表示地心位置） --- */
  const dotGeo = new THREE.SphereGeometry(0.035, 12, 12);
  const dotMat = new THREE.MeshBasicMaterial({ color: 0xe8890c });
  const dot = new THREE.Mesh(dotGeo, dotMat);
  dot.position.set(0, 0, 0);
  scene.add(dot);
  labelObjects.push(dot);

  /* --- 标签 --- */
  const centerDiv = document.createElement('div');
  centerDiv.className = 'label-3d label-3d-center';
  centerDiv.innerHTML = `
    地心 · 6371 km
    <small>约 5000–6000 ℃</small>
    <small>约 330–360 GPa</small>
  `;
  const centerLabel = new CSS2DObject(centerDiv);
  centerLabel.position.set(xLb, yLb, 0);
  scene.add(centerLabel);
  labelObjects.push(centerLabel);
}

/* ==================== 关键界面标注（带引线） ==================== */
function addInterfaceLabels(mode){
  const interfaces = getInterfaces(mode);
  const LABEL_RADIUS = BASE_RADIUS * 1.18;

  interfaces.forEach(iface => {
    const angle = (iface.angle * Math.PI) / 210;
    const rInterface = iface.r * BASE_RADIUS;

    const xIf = Math.cos(angle) * rInterface;
    const yIf = Math.sin(angle) * rInterface;
    const xLb = Math.cos(angle) * LABEL_RADIUS;
    const yLb = Math.sin(angle) * LABEL_RADIUS;

    /* --- 引线：球心 → 界面点 → 标签点 --- */
    const pts = [
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(xIf, yIf, 0),
      new THREE.Vector3(xLb, yLb, 0)
    ];
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const mat = new THREE.LineDashedMaterial({
      color: 0x2f8fd6,
      dashSize: 0.045,
      gapSize: 0.035,
      transparent: true,
      opacity: 0.7
    });
    const line = new THREE.Line(geo, mat);
    line.computeLineDistances();
    scene.add(line);
    interfaceLines.push(line);

    /* --- 界面处的小圆点 --- */
    const dotGeo = new THREE.SphereGeometry(0.028, 10, 10);
    const dotMat = new THREE.MeshBasicMaterial({ color: 0x2f8fd6 });
    const dot = new THREE.Mesh(dotGeo, dotMat);
    dot.position.set(xIf, yIf, 0);
    scene.add(dot);
    interfaceLines.push(dot);

    /* --- 标签 --- */
    const div = document.createElement('div');
    div.className = 'label-3d label-3d-interface';
    div.innerHTML = `${iface.name}<small>${iface.info}</small>`;
    const label = new CSS2DObject(div);
    label.position.set(xLb, yLb, 0);
    scene.add(label);
    interfaceLines.push(label);
  });
}

/* ==================== 高亮 ==================== */
function updateHighlight(){
  layerMeshes.forEach(item => {
    const isSelected = item.id === currentId;
    const mat = item.mesh.material;
    if (isSelected) {
      mat.emissive = item.mesh.userData.baseColor.clone().multiplyScalar(0.55);
      mat.roughness = 0.45;
    } else {
      mat.emissive = item.mesh.userData.baseColor.clone().multiplyScalar(0.10);
      mat.roughness = 0.62;
    }
    mat.needsUpdate = true;
  });
}

/* ==================== 点击拾取 ==================== */
function onCanvasClick(event){
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const meshes = layerMeshes.map(item => item.mesh);
  const intersects = raycaster.intersectObjects(meshes, false);

  for (const hit of intersects) {
    if (hit.object.userData && hit.object.userData.id) {
      selectLayer(hit.object.userData.id);
      break;
    }
  }
}

/* ==================== 渲染循环 ==================== */
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

/* ==================== 自适应 ==================== */
function onResize(){
  const wrap = document.getElementById('canvas-wrap');
  if (!wrap || !renderer) return;
  const W = wrap.clientWidth;
  const H = wrap.clientHeight;
  if (W === 0 || H === 0) return;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
  labelRenderer.setSize(W, H);
}

/* ==================== 右侧详情 ==================== */
function renderInfo(){
  const layers = MODES[currentMode].layers;
  const layer = layers.find(l => l.id === currentId) || layers[0];
  const box = document.getElementById('info');

  box.innerHTML = `
    <div class="info-head" style="--c:${layer.color}">
      <span class="swatch"></span>
      <div>
        <h2>${layer.name}</h2>
        <p class="en">${layer.en} · ${layer.tagline}</p>
      </div>
    </div>
    <div class="stats">
      ${layer.stats.map(([k,v]) =>
        `<div class="stat"><span>${k}</span><strong>${v}</strong></div>`
      ).join('')}
    </div>
    <p class="desc">${layer.desc}</p>
    <ul class="points">
      ${layer.points.map(p => `<li>${p}</li>`).join('')}
    </ul>
  `;
}

/* ==================== 选择圈层 ==================== */
function selectLayer(id){
  currentId = id;
  updateHighlight();
  renderInfo();
}

/* ==================== 切换模式 ==================== */
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.mode === currentMode) return;
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    currentMode = btn.dataset.mode;
    currentId = MODES[currentMode].layers[0].id;

    document.getElementById('modeDesc').textContent = MODES[currentMode].desc;
    buildGlobe(currentMode);
    renderInfo();
  });
});

/* ==================== 启动 ==================== */
document.getElementById('modeDesc').textContent = MODES[currentMode].desc;

window.addEventListener('load', () => {
  initThree();
  buildGlobe(currentMode);
  renderInfo();
  setTimeout(onResize, 120);
});

window.addEventListener('resize', onResize);
</script>
</body>
